version: 2.0
# this part is optional: if not specified, the internal Postgres-DB will be used (inside Docker container)
database:
  host: gateway.docker.internal
  port: 5432
  dbname: netascore
  on_existing: abort # skip, delete, abort
  # user and password to be specified as ENV variables
# -- end of optional db part --
import:
  type: gip
  filename: A_routingexport_ogd_split.zip # triggers unzip + db import (following standard file structure of GIP files)
  # regional_code: AT5% # optional (GIP): Gemeindekennzahl; % is a wildcard; Stadt Salzburg: AT50101; List: [AT50101, AT50338]
  # bbox: [47.75, 12.98, 47.86, 13.12] # optional (GIP): [min lat, min lon, max lat, max lon] (WGS84)
optional:
  noise:
    filename: noise.gpkg # GeoPackage
    # layer: noise_lden # name of the layer to import - required if the file contains more than one layer with geometry
    # column_noise: noise # optional: name of the column containing noise values (default: noise)
    # value_mapping: # optional: map (non-numeric) values of the noise column to numeric noise values (dB) - unmapped values are ignored
    #   "55-59": 57
    #   "60-64": 62
  osm:
    filename: austria-latest.osm.pbf # required mainly for walkability indicators
    # NOTE: if an OSM file is provided, the layers 'building', 'crossing', 'facility', 'greennesss' and 'water' are extracted from OSM
  # building:
    # filename: building.gpkg # GeoPackage
  # crossing:
    # filename: crossing.gpkg # GeoPackage
  # facility:
    # filename: facility.gpkg # GeoPackage
  # greenness:
    # filename: greenness.gpkg # GeoPackage
  # water:
    # filename: water.gpkg # GeoPackage
index:
  compute_explanation: False
profiles:
  - 
    profile_name: bike
    filename: profile_bike.yml
    filter_access_bike: True
  -
    profile_name: walk
    filename: profile_walk.yml
    filter_access_walk: True
export:
  type: geopackage
  filename: gip_network.gpkg # GeoPackage: here two layers are included: "edge" including attributes and indexes; "node" including attributes
  # include_source_attributes: True  # optional: add GIP source attributes to the edge export (these receive the prefix 'gip_')
  #                                    True: predefined set of columns / list of column names, e.g. [functional_class, form_of_way]
