version: 2.0
global:
  case_id: salzburg # unique id (name) - useful if working with different datasets / areas of interest
# this part is optional: if not specified, the internal Postgres-DB will be used (inside Docker container)
database:
  host: gateway.docker.internal
  port: 5432
  dbname: netascore
  on_existing: abort # skip, delete, abort
  # user and password to be specified as ENV variables
# -- end of optional db part --
import:
  type: osm
  filename: austria-latest.osm.pbf
  # optional: clip the network to an area of interest ('place_name', 'bbox', or 'aoi_filename' as for OSM download)
  #place_name: Salzburg
  #buffer: 1000
  #clip: bbox # 'bbox' (bounding box of the AOI + buffer, default), 'aoi' (AOI geometry + buffer), or 'none'
optional:
  dem:
    filename: austria.tif # GeoTIFF
    srid: 31287
  noise:
    filename: noise.gpkg # GeoPackage
    # column_noise: noise # TODO: set from settings file
index:
  compute_explanation: False
profiles:
  -
    profile_name: bike
    filename: profile_bike.yml
    filter_access_bike: True
  -
    profile_name: walk
    filename: profile_walk.yml
    filter_access_walk: True
export:
  type: geopackage
  filename: netascore_<case_id>.gpkg # GeoPackage: here two layers are included: "edge" including attributes and indexes; "node" including attributes
