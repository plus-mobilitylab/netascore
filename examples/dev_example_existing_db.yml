version: 2.0
# development example: running NetAScore in Docker, using existing PostgreSQL database on the host machine (outside Docker)
# - see https://plus-mobilitylab.github.io/netascore-documentation/advanced-docker.html#only-the-script-runs-in-docker
# all settings and options: https://plus-mobilitylab.github.io/netascore-documentation/Configuration-of-the-settings.html
global:
  case_id: dev_salzburg
database:
  host: gateway.docker.internal
  port: 5432              # port of the PostgreSQL server
  dbname: postgres        # target database
  username: postgres      # preferably given as environment variables DB_USERNAME and DB_PASSWORD instead
  password: postgres
import:
  type: osm
  on_existing: reuse_or_overwrite # reuse (default), reuse_or_overwrite, overwrite, abort
  place_name: Salzburg  # OSM download for the area of interest (Overpass API)
  interactive: False
  buffer: 1000
  clip: bbox
profiles:
  -
    profile_name: bike
    filename: profile_bike.yml
    filter_access_bike: True
  -
    profile_name: walk
    filename: profile_walk.yml
    filter_access_walk: True
export:
  type: geopackage
  filename: netascore_<case_id>.gpkg
