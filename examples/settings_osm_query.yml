version: 2.0
# documentation of all settings: https://plus-mobilitylab.github.io/netascore-documentation/Configuration-of-the-settings.html

# global settings that are relevant across processing steps
global:
  case_id: salzburg # unique id (name) - useful for working with different datasets / areas of interest
  # target_srid: 32633 # optional: coordinate system to use (only metric currently supported, e.g. UTM); default: UTM zone of the area of interest (auto-determined)

# using the database of the Docker setup (host 'netascore-db', see docker-compose.yml)
database:
  host: netascore-db
  port: 5432
  dbname: postgres
  # username and password: preferably given as environment variables DB_USERNAME and DB_PASSWORD
  username: postgres
  password: postgres

import:
  type: osm
  on_existing: reuse_or_overwrite # reuse (default), reuse_or_overwrite, overwrite, abort - for the area of interest, the OSM download, and the datasets derived from OSM
  place_name: Salzburg
  # alternatives for defining the area of interest (instead of place_name):
  # bbox: [47.7957, 13.0117, 47.8410, 13.0748] # [min lat, min lon, max lat, max lon] (WGS84)
  # aoi_filename: aoi.gpkg # polygon(s) of the area of interest (GeoPackage; features named like the case_id, or all features)
  interactive: False # if true, allows for interactive choice in case multiple results were returned for given AOI query (otherwise first is used)
  buffer: 1000 # in m - extends the area of interest
  clip: bbox # clip the network to the area of interest: 'bbox' (bounding box of the AOI + buffer, default), 'aoi' (AOI geometry + buffer), or 'none'
  # max_download_area: 1500 # optional: maximum area (km²) of OSM downloads from the Overpass API (default: 1500) - for larger areas use an OSM file (see settings_osm_file.yml and https://plus-mobilitylab.github.io/netascore-documentation/Configuration-of-the-settings.html#additional-options-for-osm)
  # include_rail: False # optional: include railways in the network (default: False)
  # include_aerialway: False # optional: include aerial ways (e.g. cable cars) in the network (default: False)

# optional datasets: e.g. a DEM for gradients and noise data (see settings_osm_file.yml and https://plus-mobilitylab.github.io/netascore-documentation/Configuration-of-the-settings.html#section-optional)

index:
  compute_explanation: True # adds columns explaining the index values (set to False to reduce output size, e.g. for large networks)

profiles:
  -
    profile_name: bike
    filename: profile_bike.yml
    filter_access_bike: True
  -
    profile_name: walk
    filename: profile_walk.yml
    filter_access_walk: True
  # -
  #   profile_name: bike_incwalk # bikeability incl. segments only accessible on foot (e.g. push the bike) - for routing purposes
  #   filename: profile_bike.yml
  #   filter_access_bike: True
  #   filter_access_walk: True

export:
  type: geopackage
  filename: netascore_<case_id>.gpkg # GeoPackage: here two layers are included: "edge" including attributes and indexes; "node" including attributes
  # include_source_attributes: True  # optional: add OSM attributes to the edge export (these receive the prefix 'osm_')
  #                                    True: predefined set of columns / list of column names or OSM tag keys, e.g. [name, highway, lit, sidewalk:left]
