# Release of NetAScore: a new version number in settings.py (NETASCORE_VERSION) on the main branch creates the release.
# - updates CITATION.cff (version, date-released) and CHANGELOG.md (release date in the heading of the version) and
#   commits these changes to main (see .github/scripts/release_metadata.py)
# - creates the tag v<version> and the GitHub release (release notes: section of the version in CHANGELOG.md),
#   which triggers the Zenodo entry (metadata: .zenodo.json)
#
# Automatic releases on push are only enabled if the repository variable AUTO_RELEASE is 'true'
# (Settings > Secrets and variables > Actions > Variables).
# Manual runs (Actions > Release > Run workflow) are dry runs by default: they only show what would happen.
#
# Optional: publishing the Docker image of each new release to Docker Hub (job 'docker', scripts/build_docker_image.py,
# platforms linux/amd64 and linux/arm64) - enabled if the repository variable DOCKER_PUBLISH is 'true'. Requires the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token of Docker Hub); image name: repository variable
# DOCKER_IMAGE (default: plusmobilitylab/netascore). The tag 'latest' is set if the version is the highest release.
# A manual run with 'publish_docker' publishes the image of the current version also if its release already exists
# (e.g. to retry after a failed Docker build).
name: Release

on:
  push:
    branches: [main]
    paths: [settings.py]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only show what would happen (no commit, tag, or release)"
        type: boolean
        default: true
      publish_docker:
        description: "Publish the Docker image of the version, also if its release already exists (requires DOCKER_PUBLISH; uncheck dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.create.outputs.released }}
      dry_run: ${{ env.DRY_RUN }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # incl. tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      # state of the release - each run continues where a previous (failed) run stopped:
      # tag and GitHub release exist: nothing to do; only the tag exists: create the release; no tag: complete release
      - name: Determine version and release state
        id: version
        run: |
          version=$(python .github/scripts/release_metadata.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag_exists=false; release_exists=false
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then tag_exists=true; fi
          if gh release view "v$version" >/dev/null 2>&1; then release_exists=true; fi
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          {
            echo "## Release v$version"
            if [ "$DRY_RUN" = "true" ]; then echo "**Dry run** - nothing is committed, tagged, or released."; fi
            if [ "$release_exists" = "true" ]; then
              echo "Version $version is already released (tag and GitHub release v$version exist) - nothing to do."
            elif [ "$tag_exists" = "true" ]; then
              echo "Tag v$version exists, but no GitHub release (e.g. a previous run failed) - only the release is created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check branch
        if: steps.version.outputs.release_exists == 'false' && env.DRY_RUN != 'true' && github.ref_name != 'main'
        run: |
          echo "::error::Releases are only created from the main branch (current: ${{ github.ref_name }}). Use a dry run for other branches."
          exit 1

      - name: Prepare release metadata
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          python .github/scripts/release_metadata.py prepare --notes-file "$RUNNER_TEMP/release_notes.md"
          {
            echo "### Changes to the files"
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag
        if: steps.version.outputs.tag_exists == 'false' && env.DRY_RUN != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # no changes: the release commit is already on the branch (previous run failed before tagging)
          if ! git diff --quiet; then git commit -am "release v$version"; fi
          git tag "v$version"
          # commit and tag are pushed together (both or none)
          git push --atomic origin "HEAD:${{ github.ref_name }}" "v$version"

      - name: Release notes of the existing tag
        if: steps.version.outputs.tag_exists == 'true' && steps.version.outputs.release_exists == 'false'
        run: |
          git checkout -q "v${{ steps.version.outputs.version }}"
          python .github/scripts/release_metadata.py notes --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Show release notes
        if: steps.version.outputs.release_exists == 'false'
        run: |
          { echo "### Release notes"; cat "$RUNNER_TEMP/release_notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        id: create
        if: steps.version.outputs.release_exists == 'false' && env.DRY_RUN != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" --verify-tag --title "NetAScore $version" --notes-file "$RUNNER_TEMP/release_notes.md"
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Docker image of the release (optional, see above)
  docker:
    needs: release
    if: >-
      vars.DOCKER_PUBLISH == 'true' && needs.release.outputs.dry_run != 'true' &&
      (needs.release.outputs.released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}  # exactly the released state
          fetch-depth: 0  # incl. tags (code state, highest release)

      - uses: docker/setup-qemu-action@v4  # emulation for building linux/arm64 on amd64 runners

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          # 'latest' only for the highest release (not e.g. for a bug fix release of an older version)
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          latest=""; if [ "$highest" = "v$VERSION" ]; then latest="--latest"; fi
          python3 scripts/build_docker_image.py --push $latest --image "${{ vars.DOCKER_IMAGE || 'plusmobilitylab/netascore' }}"
          image="${{ vars.DOCKER_IMAGE || 'plusmobilitylab/netascore' }}"
          { echo "### Docker image"; echo "Published: \`$image:$VERSION\`$([ -n "$latest" ] && echo " and \`$image:latest\`") (linux/amd64, linux/arm64)"; } >> "$GITHUB_STEP_SUMMARY"
